<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diablo 4 Build Planner</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <h1>⚔️ Diablo 4 Build Planner</h1>
        <div class="header-actions">
          <button id="newBtn" class="btn btn-secondary" title="New Build">
            <span>🆕 New</span>
          </button>
          <button id="saveBtn" class="btn btn-primary" title="Save Build">
            <span>💾 Save</span>
          </button>
          <button id="loadBtn" class="btn btn-secondary" title="Load Build">
            <span>📂 Load</span>
          </button>
          <button id="exportBtn" class="btn btn-secondary" title="Export Build">
            <span>📤 Export</span>
          </button>
          <button id="shareBtn" class="btn btn-secondary" title="Share Build">
            <span>🔗 Share</span>
          </button>
          <button id="resetBtn" class="btn btn-danger" title="Reset Build">
            <span>🔄 Reset</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Class Selection Screen -->
      <div id="classSelection" class="class-selection">
        <!-- Populated by JavaScript -->
      </div>

      <!-- Build Planner Screen (hidden by default) -->
      <div id="buildPlanner" class="build-planner" style="display: none;">
        <!-- Build Header -->
        <div id="buildHeader" class="build-header">
          <!-- Populated by JavaScript -->
        </div>

        <!-- Build Content Grid -->
        <div class="build-content">
          <!-- Gear Section -->
          <section class="panel gear-panel">
            <div id="gearSlots">
              <!-- Populated by JavaScript -->
            </div>
          </section>

          <!-- Skill Tree Section -->
          <section class="panel skill-panel">
            <div id="skillTree">
              <!-- Populated by JavaScript -->
            </div>
          </section>

          <!-- Stats Section -->
          <section class="panel stats-panel">
            <div id="stats">
              <!-- Populated by JavaScript -->
            </div>
          </section>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Diablo 4 Build Planner - Created with ❤️ for the Sanctuary community</p>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
